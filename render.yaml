services:
  - type: web
    name: financial-cards-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://financial-cards.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.11.6
    plan: free
